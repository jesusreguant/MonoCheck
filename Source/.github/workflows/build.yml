name: Build MonoCheck (macOS app + plugins, Windows VST3)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Localizar el proyecto
        shell: bash
        run: |
          if [ -f CMakeLists.txt ]; then
            PROJECT_DIR=.
          elif [ -f MonoCheck/CMakeLists.txt ]; then
            PROJECT_DIR=MonoCheck
          else
            echo "::error::No se encuentra CMakeLists.txt ni en la raiz ni en la carpeta MonoCheck"
            exit 1
          fi
          echo "Proyecto en: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          # Comprueba que estan todos los archivos necesarios
          MISSING=""
          for f in CMakeLists.txt Source/MonoCheckEngine.h Source/MonoCheckView.h Source/MonoCheckView.cpp Source/PluginProcessor.h Source/PluginProcessor.cpp Source/PluginEditor.h Source/PluginEditor.cpp Source/AppMain.cpp; do
            if [ ! -f "$PROJECT_DIR/$f" ]; then
              echo "::error::Falta el archivo $PROJECT_DIR/$f"
              MISSING="si"
            fi
          done
          echo "Contenido de $PROJECT_DIR/Source:"
          ls -la "$PROJECT_DIR/Source" || true
          if [ -n "$MISSING" ]; then exit 1; fi

      - name: Configure
        shell: bash
        run: |
          set -o pipefail
          cmake -S "$PROJECT_DIR" -B build -DCMAKE_BUILD_TYPE=Release -DCOPY_AFTER_BUILD=OFF 2>&1 | tee configure.log

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --config Release 2>&1 | tee build.log

      - name: Mostrar errores
        if: failure()
        shell: bash
        run: |
          summarize() {
            if [ -f "$1" ]; then
              MSG="$(grep -E -A3 "$2" "$1" | head -n 16 | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')"
              if [ -n "$MSG" ]; then echo "::error title=Errores en $1::$MSG"; fi
            fi
          }
          summarize configure.log "CMake Error"
          summarize build.log "error( C[0-9]+)?:|fatal error"
          true

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 '^project' "$PROJECT_DIR/CMakeLists.txt" | sed -E 's/.*VERSION ([0-9.]+).*/\1/')"
          VST3="$(find build -maxdepth 5 -name 'MonoCheck.vst3' -type d | head -n 1)"
          AU="$(find build -maxdepth 5 -name 'MonoCheck.component' -type d | head -n 1)"
          APP="$(find build -maxdepth 5 -name 'MonoCheck.app' -type d | head -n 1)"
          echo "Version: $VERSION"
          echo "VST3: $VST3"
          echo "AU: $AU"
          echo "APP: $APP"
          codesign --force --deep --sign - "$VST3"
          codesign --force --deep --sign - "$AU"
          codesign --force --deep --sign - "$APP"

          # Instalador .pkg de los plugins (VST3 + AU en las carpetas del sistema)
          mkdir -p pkgroot/Library/Audio/Plug-Ins/VST3 pkgroot/Library/Audio/Plug-Ins/Components pkgscripts
          cp -R "$VST3" pkgroot/Library/Audio/Plug-Ins/VST3/
          cp -R "$AU" pkgroot/Library/Audio/Plug-Ins/Components/
          printf '#!/bin/bash\nkillall -9 AudioComponentRegistrar 2>/dev/null || true\nexit 0\n' > pkgscripts/postinstall
          chmod +x pkgscripts/postinstall
          pkgbuild --root pkgroot --scripts pkgscripts --ownership recommended \
            --identifier com.txuso.monocheck.plugins --version "$VERSION" \
            --install-location / "MonoCheck-Plugins-${VERSION}.pkg"

          # DMG de la app (arrastrar a Aplicaciones)
          mkdir -p dmgroot
          cp -R "$APP" dmgroot/
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname "MonoCheck" -srcfolder dmgroot -ov -format UDZO "MonoCheck-App-${VERSION}.dmg"
          ls -la

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vst3 = Get-ChildItem -Path build -Recurse -Directory -Filter MonoCheck.vst3 | Select-Object -First 1
          Write-Host "Encontrado: $($vst3.FullName)"
          Compress-Archive -Path $vst3.FullName -DestinationPath MonoCheck-VST3-Windows.zip

      - name: Upload (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: MonoCheck-macOS
          path: |
            MonoCheck-App-*.dmg
            MonoCheck-Plugins-*.pkg

      - name: Upload (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: MonoCheck-Windows
          path: MonoCheck-VST3-Windows.zip
